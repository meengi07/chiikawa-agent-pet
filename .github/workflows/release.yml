name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check shared version
        id: version
        shell: bash
        run: |
          version=$(tr -d '\r\n' < VERSION)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$version"; fi
      - run: ./scripts/test.sh
      - run: ./scripts/package-mac.sh '${{ matrix.arch }}'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-mac-${{ matrix.arch }}
          path: build/release/mac/${{ steps.version.outputs.value }}/
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check shared version
        id: version
        shell: bash
        run: |
          version=$(tr -d '\r\n' < VERSION)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$version"; fi
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: choco install nsis --yes --no-progress
      - name: Prove native panel-close regression against prior source
        shell: pwsh
        run: |
          git fetch --depth 1 origin 089861e9e8256d74027a4a6acc17f1c3d0911894
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the exact pre-fix baseline.' }
          $path = Join-Path $PWD 'windows/PetApp.cs'
          $fixed = [IO.File]::ReadAllBytes($path)
          try {
            $baseline = git show 089861e9e8256d74027a4a6acc17f1c3d0911894:windows/PetApp.cs
            if ($LASTEXITCODE -ne 0) { throw 'Could not load pre-fix source.' }
            [IO.File]::WriteAllText($path, ($baseline -join "`n") + "`n")
            $baselineOutput = dotnet run --project checks/windows-ui/UiSmoke.csproj --configuration Release 2>&1
            $baselineExit = $LASTEXITCODE
            $baselineText = $baselineOutput -join "`n"
            Write-Host $baselineText
            if ($baselineExit -eq 0 -or $baselineText -notmatch 'FAIL native-panel-close' -or $baselineText -notmatch 'FAIL dispatcher: System.InvalidOperationException') {
              throw 'Pre-fix source did not fail on the expected native panel-close exception.'
            }
            Write-Host "Prior-source native panel-close regression failed as expected."
          } finally {
            [IO.File]::WriteAllBytes($path, $fixed)
          }
          git diff --exit-code -- windows/PetApp.cs
          if ($LASTEXITCODE -ne 0) { throw 'Fixed source was not restored after the baseline probe.' }
      - run: ./scripts/package-windows.ps1
      - name: Probe released and current Windows executables
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/meengi07/chiikawa-agent-pet/releases/download/v1.1.2/ChiikawaPet-1.1.2-win-x64.zip" -OutFile build/released-windows.zip
          Expand-Archive build/released-windows.zip build/released-windows
          dotnet run --project checks/windows-ui/UiSmoke.csproj --configuration Release -- --executable "$PWD/build/released-windows/ChiikawaPet.exe"
          Write-Host "Released v1.1.2 diagnostic exit: $LASTEXITCODE"
          dotnet run --project checks/windows-ui/UiSmoke.csproj --configuration Release -- --executable "$PWD/build/windows/win-x64/ChiikawaPet.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Current Windows executable interaction failed.' }
      - name: Check Windows pet interactions
        run: dotnet run --project checks/windows-ui/UiSmoke.csproj --configuration Release
      - name: Check Windows installation
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          ./scripts/test-installed-windows.ps1 -Installer "./build/release/windows/$version/ChiikawaPet-$version-win-x64-setup.exe"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-windows-x64
          path: build/release/windows/${{ steps.version.outputs.value }}/
          if-no-files-found: error

  draft-release:
    if: github.ref_type == 'tag'
    needs: [mac, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - run: python3 scripts/check-release.py all release
      - name: Create unified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
            --title "Chiikawa Agent Pet v$version" --notes-file "docs/releases/v$version.md"
